# Скопируйте этот файл в config.yaml и заполните.

# Ключи приложения: https://my.telegram.org → API development tools
api_id: 123456
api_hash: "0123456789abcdef0123456789abcdef"

# Какие чаты отслеживать.
# 1) Автоматически: все ваши группы, в названии которых есть одно из этих слов.
auto_chat_keywords: ["барахолк", "куплю", "продам", "купи", "прода", "объявлен", "авито", "б/у"]
# 2) Вручную: @username, ссылка или числовой id (посмотреть: python monitor.py --list-chats).
chats: []
#  - "@baraholka_tomsk"
#  - "https://t.me/+AbCdEfGh"
#  - -1001234567890

# Отслеживать ли каналы (а не только группы), подходящие по названию.
include_channels: false

# Что ищем. Пусто = iPhone Duo в любом написании (iphone duo, айфон дуо, айфон-дуо…).
# Можно задать свои регулярные выражения.
product_patterns: []
# Объявления с этими словами пропускаются (например, аксессуары).
exclude_patterns: []
#  - "чехол"
#  - "стекло"

# При запуске просмотреть объявления за последние N минут (0 — только новые).
backfill_minutes: 60

# Куда слать уведомления о находках. "me" — «Избранное». Пусто — не слать.
notify_chat: "me"

# ПРОБНЫЙ РЕЖИМ: всё находит и уведомляет, но авторам НЕ пишет.
# Проверьте, что находки верные, впишите свои тексты ниже и поставьте false.
dry_run: true

reply:
  # dm — писать автору в личку, reply — отвечать в самом чате, off — не отвечать.
  mode: dm
  # Ответ тому, кто ХОЧЕТ КУПИТЬ. {name} — имя автора. Пустой текст — не отвечать.
  to_buyer: |
    Здравствуйте, {name}! Увидел ваше объявление — продаю iPhone Duo.
    Состояние отличное, полный комплект. Актуально?
  # Ответ тому, кто ПРОДАЁТ.
  to_seller: |
    Здравствуйте, {name}! Интересует ваш iPhone Duo.
    Подскажите, пожалуйста, состояние, память и окончательную цену.
  # Случайная пауза перед ответом, секунд (чтобы не выглядеть ботом).
  delay_seconds: [20, 90]
  # Не больше стольких ответов в час — защита от блокировки за спам.
  max_per_hour: 10
  # Одному и тому же человеку не писать повторно столько дней.
  cooldown_days: 7
